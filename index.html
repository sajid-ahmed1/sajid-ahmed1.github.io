<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sajid Ahmed's second brain — a public wiki of notes on work, study, and personal curiosities.">
    <meta property="og:title" content="Sajid Ahmed | Second Brain">
    <meta property="og:description" content="A public wiki and curiosity map.">
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/69683657?v=4">
    <title>Sajid Ahmed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===================== DESKTOP ===================== -->
    <div id="desktop">
        <div id="desktop-icons"><!-- icons injected by JS --></div>
    </div>

    <!-- Open windows are appended here -->
    <div id="windows"></div>

    <!-- ===================== TASKBAR ===================== -->
    <div id="taskbar">
        <button id="start-btn">
            <span class="start-logo">🪟</span> <strong>Start</strong>
        </button>
        <div id="task-buttons"></div>
        <div id="tray">
            <span id="clock">--:--</span>
        </div>
    </div>

    <!-- Start menu (hidden until Start is clicked) -->
    <div id="start-menu" class="hidden">
        <div class="start-sidebar"><span>Second&nbsp;Brain&nbsp;98</span></div>
        <ul class="start-list" id="start-list"><!-- items injected by JS --></ul>
    </div>

    <!-- Markdown + sanitize + syntax highlight (CDN, no build step) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
